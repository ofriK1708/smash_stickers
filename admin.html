<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sticker admin</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--text:#1f1a17;--muted:#7a6f68;--line:#e6ded5;--accent:#ff5c39;--ok:#1d8a5b;--bad:#c4382c}
@media (prefers-color-scheme:dark){:root{--bg:#16130f;--card:#221d18;--text:#f6efe8;--muted:#a89c92;--line:#3a3129;--accent:#ff7a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;margin:0 0 16px}
h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px;background:var(--bg);color:var(--text)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:15px;color:var(--text)}
.check input{width:20px;height:20px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.item img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:var(--bg)}
.item .name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.handle{cursor:grab;font-size:24px;color:var(--muted);padding:0 6px;touch-action:none}
.sm{padding:8px 12px;font-size:15px}
.status{font-size:15px;margin-top:12px;min-height:20px}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:none}
.bar.show{display:block}
.bar .inner{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hint{font-size:14px;color:var(--muted);line-height:1.5}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer;padding:8px 0}
.addbtn{display:block;text-align:center;padding:18px;border:2px dashed var(--line);border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;color:var(--accent)}
.ghost{opacity:.4}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Sticker admin</h1>

<div class="card hide" id="login">
<h2>Sign in</h2>
<label for="pw">Password</label>
<input type="password" id="pw" autocomplete="current-password">
<label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this phone</label>
<div style="margin-top:16px"><button class="btn primary big" id="loginBtn">Sign in</button></div>
<div class="status" id="loginStatus"></div>
</div>

<div class="card hide" id="setup">
<h2>One-time setup</h2>
<p class="hint">For the site owner only. This locks the admin with a password, so whoever you share it with only needs the password.</p>
<label for="owner">GitHub username</label><input type="text" id="owner" autocapitalize="off" autocomplete="off">
<label for="repo">Repository name</label><input type="text" id="repo" autocapitalize="off" autocomplete="off">
<label for="branch">Branch</label><input type="text" id="branch" value="main" autocapitalize="off">
<label for="token">GitHub access token</label><input type="password" id="token" autocomplete="off">
<label for="newpw">Admin password (at least 10 characters)</label><input type="password" id="newpw" autocomplete="new-password">
<label for="newpw2">Password again</label><input type="password" id="newpw2" autocomplete="new-password">
<div style="margin-top:16px"><button class="btn primary big" id="setupBtn">Save password</button></div>
<div class="status" id="setupStatus"></div>
<button class="link hide" id="backToLogin">Back to sign in</button>
</div>

<div id="app" class="hide">
<div class="card">
<label class="addbtn" for="files">+ Add GIFs or stickers</label>
<input type="file" id="files" multiple class="hide">
<div class="status" id="upStatus"></div>
</div>
<div class="card">
<div class="row" style="justify-content:space-between;margin-bottom:10px"><strong id="n">0 items</strong><span class="hint">Hold ≡ and drag to move</span></div>
<ul class="list" id="list"></ul>
</div>
<div class="card">
<label for="title" style="margin-top:0">Page title</label><input type="text" id="title">
</div>
<div class="row" style="justify-content:space-between">
<button class="link" id="logout">Sign out</button>
<button class="link" id="changePw">Change password</button>
</div>
</div>
</main>

<div class="bar" id="bar"><div class="inner"><span class="hint" id="barText">Not saved yet</span><button class="btn primary" id="save">Save</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SESSION='sticker-admin-session';
const ITER=600000;
let cfg={},gallery={title:'Our stickers',items:[]},gallerySha=null,dirty=false,toDelete=[],lock=null;

function show(id){['login','setup','app'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function status(id,msg,kind=''){const e=$(id);e.textContent=msg;e.className='status '+kind}

const te=new TextEncoder(),td=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function lockToken(token,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await keyFrom(pw,salt,ITER);
  const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(token));
  return {salt:b64(salt),iv:b64(iv),iter:ITER,data:b64(data)};
}
async function unlockToken(l,pw){
  const key=await keyFrom(pw,unb64(l.salt),l.iter);
  return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(l.iv)},key,unb64(l.data)));
}

async function gh(path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${path}`,{...opts,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){let m=r.status+'';try{m=(await r.json()).message||m}catch(e){}const err=new Error(m);err.status=r.status;throw err}
  return r.status===204?null:r.json();
}
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const raw=f=>`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${f}`;

function guessRepo(){
  const h=location.hostname;
  if(h.endsWith('.github.io')){$('owner').value=h.split('.')[0];const p=location.pathname.split('/').filter(Boolean);$('repo').value=p.length>1?p[0]:h}
}
async function putFile(path,content,message){
  let sha;try{sha=(await gh(`contents/${path}?ref=${cfg.branch}`)).sha}catch(e){if(e.status!==404)throw e}
  const body={message,content,branch:cfg.branch};if(sha)body.sha=sha;
  return gh('contents/'+path,{method:'PUT',body:JSON.stringify(body)});
}

async function start(){
  try{const s=JSON.parse(localStorage.getItem(SESSION));if(s&&s.token){cfg=s;try{await openApp();return}catch(e){localStorage.removeItem(SESSION)}}}catch(e){}
  try{const r=await fetch('admin-key.json?t='+Date.now());if(r.ok){lock=await r.json();show('login');$('pw').focus();return}}catch(e){}
  guessRepo();show('setup');
}

$('loginBtn').onclick=async()=>{
  const pw=$('pw').value;if(!pw){status('loginStatus','Type the password first.','bad');return}
  $('loginBtn').disabled=true;status('loginStatus','Checking…');
  try{
    const token=await unlockToken(lock,pw);
    cfg={owner:lock.owner,repo:lock.repo,branch:lock.branch,token};
    await openApp();
    if($('remember').checked){try{localStorage.setItem(SESSION,JSON.stringify(cfg))}catch(e){}}
    $('pw').value='';
  }catch(e){status('loginStatus',e.status?'Signed in, but GitHub refused: '+e.message:'Wrong password. Try again.','bad')}
  $('loginBtn').disabled=false;
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});

$('setupBtn').onclick=async()=>{
  const owner=$('owner').value.trim(),repo=$('repo').value.trim(),branch=$('branch').value.trim()||'main',token=$('token').value.trim(),pw=$('newpw').value;
  if(!owner||!repo||!token){status('setupStatus','Fill in username, repository and token.','bad');return}
  if(pw.length<10){status('setupStatus','Use a password of at least 10 characters.','bad');return}
  if(pw!==$('newpw2').value){status('setupStatus',"The two passwords don't match.",'bad');return}
  $('setupBtn').disabled=true;status('setupStatus','Saving… (takes a few seconds)');
  try{
    cfg={owner,repo,branch,token};
    await gh(`contents/?ref=${branch}`);
    const l=await lockToken(token,pw);
    await putFile('admin-key.json',enc(JSON.stringify({owner,repo,branch,...l},null,2)+'\n'),'Set admin password');
    lock={owner,repo,branch,...l};
    ['token','newpw','newpw2'].forEach(x=>$(x).value='');
    status('setupStatus','');
    await openApp();
    alert('Password saved. Share the admin link and the password. The login screen works about a minute from now.');
  }catch(e){status('setupStatus','Could not save: '+e.message,'bad')}
  $('setupBtn').disabled=false;
};
$('backToLogin').onclick=()=>show('login');
$('changePw').onclick=()=>{$('owner').value=cfg.owner;$('repo').value=cfg.repo;$('branch').value=cfg.branch;$('token').value=cfg.token;show('setup');$('backToLogin').classList.add('hide')};
$('logout').onclick=()=>{try{localStorage.removeItem(SESSION)}catch(e){}location.reload()};

async function openApp(){
  try{const f=await gh(`contents/gallery.json?ref=${cfg.branch}`);gallerySha=f.sha;gallery=JSON.parse(dec(f.content))}
  catch(e){if(e.status!==404)throw e;gallerySha=null;gallery={title:'Our stickers',items:[]}}
  gallery.items=gallery.items||[];$('title').value=gallery.title||'';render();show('app');
}

function render(){
  const ul=$('list');ul.innerHTML='';
  $('n').textContent=gallery.items.length+(gallery.items.length===1?' item':' items');
  gallery.items.forEach((it,i)=>{
    const li=document.createElement('li');li.className='item';
    const h=document.createElement('span');h.className='handle';h.textContent='≡';
    const isVid=it.file.endsWith('.mp4');
    const im=document.createElement(isVid?'video':'img');im.src=it.preview||raw(it.file);
    if(isVid){im.muted=true;im.loop=true;im.autoplay=true;im.playsInline=true;im.style.cssText='width:64px;height:64px;object-fit:contain;border-radius:8px;background:var(--bg)'}else im.alt='';
    const nm=document.createElement('span');nm.className='name';nm.textContent=it.name||it.file.split('/').pop();
    const up=document.createElement('button');up.className='btn sm';up.textContent='↑';up.setAttribute('aria-label','Move up');up.onclick=()=>move(i,i-1);
    const del=document.createElement('button');del.className='btn sm';del.textContent='Delete';del.onclick=()=>remove(i);
    li.append(h,im,nm,up,del);ul.appendChild(li);
  });
}
function markDirty(){dirty=true;$('bar').classList.add('show');$('barText').textContent='Not saved yet'}
function move(a,b){if(b<0||b>=gallery.items.length)return;const [x]=gallery.items.splice(a,1);gallery.items.splice(b,0,x);render();markDirty()}
function remove(i){const it=gallery.items[i];if(!confirm('Delete this one?'))return;gallery.items.splice(i,1);toDelete.push(it.file);render();markDirty()}
$('title').oninput=()=>{gallery.title=$('title').value;markDirty()};

new Sortable($('list'),{handle:'.handle',animation:150,ghostClass:'ghost',onEnd:e=>{if(e.oldIndex!==e.newIndex){const [x]=gallery.items.splice(e.oldIndex,1);gallery.items.splice(e.newIndex,0,x);render();markDirty()}}});

function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function sniff(file){
  const b=new Uint8Array(await file.slice(0,16).arrayBuffer());
  const s=(i,n)=>String.fromCharCode(...b.slice(i,i+n));
  if(s(0,4)==='RIFF'&&s(8,4)==='WEBP')return{ext:'.webp',mime:'image/webp'};
  if(s(0,3)==='GIF')return{ext:'.gif',mime:'image/gif'};
  if(b[0]===0x89&&s(1,3)==='PNG')return{ext:'.png',mime:'image/png'};
  if(b[0]===0xFF&&b[1]===0xD8)return{ext:'.jpg',mime:'image/jpeg'};
  if(s(4,4)==='ftyp')return{ext:'.mp4',mime:'video/mp4'};
  return null;
}
function safeName(n,ext){const dot=n.lastIndexOf('.');const base=(dot>0?n.slice(0,dot):n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'sticker';return Date.now().toString(36)+'-'+base+ext}

$('files').onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  let done=0;
  for(const f of files){
    if(f.size>20*1024*1024){status('upStatus',f.name+' is too big (over 20 MB)','bad');continue}
    status('upStatus',`Uploading ${done+1} of ${files.length}…`);
    try{
      const t=await sniff(f);
      if(!t){status('upStatus',f.name+" isn't a GIF, sticker, image or video, skipped",'bad');continue}
      const path='gifs/'+safeName(f.name,t.ext);
      await gh('contents/'+path,{method:'PUT',body:JSON.stringify({message:'Add '+f.name,content:await readB64(f),branch:cfg.branch})});
      gallery.items.push({file:path,name:f.name,preview:URL.createObjectURL(new Blob([f],{type:t.mime}))});done++;
    }catch(err){status('upStatus','Upload failed for '+f.name+': '+err.message,'bad')}
  }
  e.target.value='';render();
  if(done){markDirty();status('upStatus',`${done} added. Tap Save at the bottom to show them on the site.`,'ok')}
};

$('save').onclick=async()=>{
  $('save').disabled=true;$('barText').textContent='Saving…';
  try{
    const clean={title:gallery.title||'Our stickers',items:gallery.items.map(({file,name})=>({file,name}))};
    const body={message:'Update gallery',content:enc(JSON.stringify(clean,null,2)+'\n'),branch:cfg.branch};
    if(gallerySha)body.sha=gallerySha;
    const r=await gh('contents/gallery.json',{method:'PUT',body:JSON.stringify(body)});
    gallerySha=r.content.sha;
    for(const f of toDelete){try{const m=await gh(`contents/${f}?ref=${cfg.branch}`);await gh('contents/'+f,{method:'DELETE',body:JSON.stringify({message:'Remove '+f,sha:m.sha,branch:cfg.branch})})}catch(e){}}
    toDelete=[];dirty=false;
    $('barText').textContent='Saved! Live on the site in about a minute.';
    setTimeout(()=>{if(!dirty)$('bar').classList.remove('show')},4000);
  }catch(e){
    $('barText').textContent=e.status===409?'Someone else saved meanwhile. Reload the page and try again.':'Save failed: '+e.message;
  }
  $('save').disabled=false;
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

start();
</script>
</body>
</html>
